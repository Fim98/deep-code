name: Package Desktop App

on:
  workflow_dispatch:

jobs:
  package:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            arch: x64
            runner: macos-13
          - platform: mac
            arch: arm64
            runner: macos-14
          - platform: win
            arch: x64
            runner: windows-latest
          - platform: win
            arch: arm64
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Package
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --config electron-builder.config.ts --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepcode-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/**
          if-no-files-found: error
